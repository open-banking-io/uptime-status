owner: open-banking-io
repo: uptime-status

sites:
  - name: Website
    url: https://open-banking.io/en
  - name: API
    url: https://open-banking.io/readyz
  - name: Supported banks
    url: https://open-banking.io/en/banks

status-website:
  cname: status.open-banking.io
  name: open-banking.io status
  logoUrl: https://status.open-banking.io/logo-horizontal.svg
  logoHref: https://open-banking.io
  hideNavTitle: true
  faviconSvg: https://status.open-banking.io/favicon.svg
  themeUrl: https://status.open-banking.io/open-banking.css
  links:
    # Loaded after global.css + component styles, so the structural rules in
    # open-banking.css also win cascade order (themeUrl loads first)
    - rel: stylesheet
      href: https://status.open-banking.io/open-banking.css
  introTitle: "**open-banking.io** service status"
  introMessage: Live availability of the open-banking.io website and API, checked every 5 minutes.
  metaTags:
    - name: "color-scheme"
      content: "dark light"
  navbar:
    - title: Status
      href: /
    - title: Subscribe
      href: https://github.com/open-banking-io/uptime-status/subscription
    - title: open-banking.io
      href: https://open-banking.io
