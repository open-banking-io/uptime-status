<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>open-banking.io status</title>
<link rel="icon" href="favicon.svg" />
<style>
@font-face { font-family: 'Inter'; font-weight: 300 900; font-display: swap; src: url('inter-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Inter'; font-weight: 300 900; font-display: swap; src: url('inter-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113; }

:root {
  --bg: #f6f8fc; --card: #ffffff; --card-hover: #eef2f9;
  --border: rgba(15, 23, 42, 0.10); --glow: rgba(59, 130, 246, 0.40);
  --text: #0f172a; --text-2: #475569; --text-3: #5b6b82;
  --accent: #2563eb;
  --gradient: linear-gradient(135deg, #2563eb, #0891b2);
  --up: #059669; --up-text: #065f46; --up-soft: rgba(16, 185, 129, 0.12);
  --warn: #d97706; --warn-text: #92400e; --warn-soft: rgba(245, 158, 11, 0.14);
  --down: #dc2626; --down-text: #b42318; --down-soft: rgba(220, 38, 38, 0.10);
  --idle: rgba(15, 23, 42, 0.08);
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 4px 12px rgba(15, 23, 42, 0.05);
  --wash-1: rgba(59, 130, 246, 0.14); --wash-2: rgba(34, 211, 238, 0.10);
  --nav: rgba(246, 248, 252, 0.8);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0e1a; --card: #121830; --card-hover: #1a2040;
    --border: rgba(255, 255, 255, 0.07); --glow: rgba(59, 130, 246, 0.32);
    --text: #f1f5f9; --text-2: #aab6c6; --text-3: #8b94a3;
    --accent: #60a5fa;
    --gradient: linear-gradient(135deg, #60a5fa, #22d3ee);
    --up: #10b981; --up-text: #34d399; --up-soft: rgba(16, 185, 129, 0.15);
    --warn: #f59e0b; --warn-text: #fbbf24; --warn-soft: rgba(245, 158, 11, 0.15);
    --down: #ef4444; --down-text: #fca5a5; --down-soft: rgba(239, 68, 68, 0.14);
    --idle: rgba(255, 255, 255, 0.07);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.25);
    --wash-1: rgba(59, 130, 246, 0.20); --wash-2: rgba(34, 211, 238, 0.12);
    --nav: rgba(10, 14, 26, 0.8);
  }
}

* { box-sizing: border-box; margin: 0; }
html { overflow-x: clip; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
  background-image:
    radial-gradient(60rem 36rem at 50% -12rem, var(--wash-1), transparent 70%),
    radial-gradient(40rem 28rem at 100% 0, var(--wash-2), transparent 70%);
  background-repeat: no-repeat;
}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

/* Nav */
nav { position: sticky; top: 0; z-index: 10; background: var(--nav); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); border-bottom: 1px solid var(--border); }
nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
nav img { height: 28px; display: block; }
.nav-links { display: flex; align-items: center; gap: 28px; font-size: 14px; font-weight: 500; color: var(--text-2); }
.nav-links a:hover { color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 9999px; background: #3b82f6; color: #fff !important; font-weight: 600; font-size: 14px; transition: filter 150ms, transform 150ms; }
.btn:hover { filter: brightness(1.08); }

/* Hero */
.hero { text-align: center; padding: 88px 0 56px; }
.badge { display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px; border: 1px solid var(--border); border-radius: 9999px; background: var(--card); font-size: 13px; font-weight: 500; color: var(--text-2); box-shadow: var(--shadow); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); position: relative; }
.dot::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
[data-state='degraded'] .dot { background: var(--warn); }
[data-state='down'] .dot { background: var(--down); }
@keyframes ping { 75%, 100% { transform: scale(2.6); opacity: 0; } }
h1 { font-size: clamp(2.4rem, 7vw, 4.25rem); font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; margin: 28px auto 20px; max-width: 14ch; }
h1 .g { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
[data-state='degraded'] h1 .g { background: none; color: var(--warn-text); }
[data-state='down'] h1 .g { background: none; color: var(--down-text); }
.lead { font-size: 1.125rem; color: var(--text-2); max-width: 520px; margin: 0 auto; }

/* Sections */
section { padding-bottom: 56px; }
.head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 13px; color: var(--text-3); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }

/* Services */
.svc { padding: 24px; }
.svc + .svc { border-top: 1px solid var(--border); }
.list { padding: 0; overflow: hidden; }
.row1 { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.name { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em; }
.url { font-size: 13px; color: var(--text-3); display: block; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 9999px; background: var(--up-soft); color: var(--up-text); white-space: nowrap; }
.pill.degraded { background: var(--warn-soft); color: var(--warn-text); }
.pill.down { background: var(--down-soft); color: var(--down-text); }
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; height: 36px; }
.bars i { border-radius: 3px; background: var(--up); opacity: 0.9; transition: opacity 150ms; }
.bars i:hover { opacity: 1; filter: brightness(1.15); }
.bars i.idle { background: var(--idle); opacity: 1; }
.bars i.warn { background: var(--warn); }
.bars i.down { background: var(--down); }
.axis { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--text-3); }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-top: 20px; }
.stat b { display: block; font-size: 1.125rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

/* Events */
.event { padding: 20px 24px; display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; }
.event + .event { border-top: 1px solid var(--border); }
.event h3 { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
.event p { font-size: 14px; color: var(--text-2); }
.event a:hover h3 { color: var(--accent); }
.tag { font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 9999px; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.tag.maint { background: rgba(59, 130, 246, 0.12); border-color: var(--glow); color: var(--accent); }
.empty { padding: 28px 24px; color: var(--text-2); font-size: 15px; text-align: center; }

footer { border-top: 1px solid var(--border); padding: 28px 0 40px; font-size: 13px; color: var(--text-3); }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
footer a:hover { color: var(--text); }

@media (max-width: 720px) {
  .nav-links a:not(.btn) { display: none; }
  .hero { padding: 56px 0 40px; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .svc { padding: 20px; }
  .event { flex-direction: column; gap: 10px; padding: 18px 20px; }
}
@media (prefers-reduced-motion: reduce) { .dot::after { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a href="https://open-banking.io" aria-label="open-banking.io"><img src="logo-horizontal.svg" alt="open-banking.io" /></a>
    <div class="nav-links">
      <a href="https://github.com/open-banking-io/uptime-status/subscription">Subscribe to updates</a>
      <a class="btn" href="https://open-banking.io">Go to open-banking.io</a>
    </div>
  </div>
</nav>

<main class="wrap" id="app" data-state="up">
  <header class="hero">
    <span class="badge"><span class="dot"></span><span id="badge">Checking status…</span></span>
    <h1 id="title">Checking <span class="g">services…</span></h1>
    <p class="lead">Live availability of the open-banking.io website and API, checked every 5 minutes.</p>
  </header>

  <section id="maint" hidden>
    <div class="head"><h2>Scheduled maintenance</h2></div>
    <div class="card" id="maint-list"></div>
  </section>

  <section>
    <div class="head"><h2>Services</h2><span class="sub">Last 30 days</span></div>
    <div class="card list" id="services"></div>
  </section>

  <section>
    <div class="head"><h2>Past incidents</h2></div>
    <div class="card" id="incidents"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© open-banking.io</span>
    <a href="https://github.com/open-banking-io/uptime-status/issues">Incident history on GitHub</a>
  </div>
</footer>

<script>
const REPO = 'open-banking-io/uptime-status';
const RAW = `https://raw.githubusercontent.com/${REPO}/master`;
const MONITORING_START = '2026-11-24';
const DAYS = 30;
const STATE_RANK = { up: 0, degraded: 1, down: 2 };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDate = (d) => new Date(d).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

function dayKeys() {
  const out = [];
  for (let i = DAYS - 1; i >= 0; i--) out.push(new Date(Date.now() - i * 864e5).toISOString().slice(0, 10));
  return out;
}

function bars(site) {
  const wrap = el('div', 'bars');
  for (const day of dayKeys()) {
    const i = el('i');
    const down = site.dailyMinutesDown[day] || 0;
    if (day < MONITORING_START) i.className = 'idle';
    else if (down >= 30) i.className = 'down';
    else if (down > 0) i.className = 'warn';
    i.title = day < MONITORING_START ? `${day}: no data` : down ? `${day}: ${down} min downtime` : `${day}: no downtime`;
    wrap.append(i);
  }
  return wrap;
}

function service(site) {
  const label = { up: 'Operational', degraded: 'Degraded', down: 'Down' }[site.status] || 'Unknown';
  const s = el('div', 'svc');
  s.innerHTML = `
    <div class="row1">
      <div><span class="name">${esc(site.name)}</span><a class="url" href="${esc(site.url)}" rel="noopener">${esc(site.url.replace(/^https?:\/\//, ''))}</a></div>
      <span class="pill ${esc(site.status)}">${label}</span>
    </div>`;
  s.append(bars(site));
  s.append(el('div', 'axis', `<span>${DAYS} days ago</span><span>Today</span>`));
  s.append(el('div', 'stats', ['Uptime 24h:uptimeDay', 'Uptime 7d:uptimeWeek', 'Uptime 30d:uptimeMonth', 'Uptime 1y:uptimeYear']
    .map((p) => { const [l, k] = p.split(':'); return `<div class="stat"><b>${esc(site[k])}</b><span>${l}</span></div>`; })
    .join('') + `<div class="stat"><b>${site.time} ms</b><span>Response</span></div>`));
  return s;
}

function overall(sites) {
  const worst = sites.reduce((w, s) => Math.max(w, STATE_RANK[s.status] ?? 0), 0);
  const state = ['up', 'degraded', 'down'][worst];
  const copy = {
    up: ['All systems operational', 'All systems', '<span class="g">operational.</span>'],
    degraded: ['Partial degradation', 'Some services are', '<span class="g">degraded.</span>'],
    down: ['Service disruption', 'We are seeing an', '<span class="g">outage.</span>'],
  }[state];
  $('app').dataset.state = state;
  $('badge').textContent = copy[0];
  $('title').innerHTML = `${copy[1]} ${copy[2]}`;
}

function parseMaintenance(issue) {
  const m = /start:\s*(\S+)[\s\S]*?end:\s*(\S+)/.exec(issue.body || '');
  return m && { start: new Date(m[1]), end: new Date(m[2]) };
}

function incidents(issues) {
  const maint = [], past = [];
  const now = Date.now();
  for (const i of issues) {
    if (i.pull_request) continue;
    const isMaint = i.labels.some((l) => l.name === 'maintenance');
    const w = isMaint ? parseMaintenance(i) : null;
    if (isMaint && w && w.end > now) maint.push({ i, w });
    else past.push({ i, w, isMaint });
  }
  const evt = (i, tag, cls, text) => {
    const a = el('a', 'event');
    a.href = i.html_url; a.rel = 'noopener';
    a.innerHTML = `<div><h3>${esc(i.title.replace(/^\[Scheduled Maintenance\]\s*/, ''))}</h3><p>${text}</p></div><span class="tag ${cls}">${tag}</span>`;
    return a;
  };
  $('maint-list').replaceChildren(...maint.map(({ i, w }) => evt(i, 'Scheduled', 'maint', `${fmtDate(w.start)} to ${fmtDate(w.end)}`)));
  $('maint').hidden = !maint.length;
  const items = past.slice(0, 10).map(({ i, w, isMaint }) =>
    evt(i, isMaint ? 'Maintenance' : i.state === 'open' ? 'Ongoing' : 'Resolved', isMaint ? 'maint' : '', w ? `${fmtDate(w.start)} to ${fmtDate(w.end)}` : fmtDate(i.created_at)));
  $('incidents').replaceChildren(...(items.length ? items : [el('div', 'empty', 'No incidents reported.')]));
}

async function load() {
  const [sites, issues] = await Promise.all([
    fetch(`${RAW}/history/summary.json`).then((r) => r.json()),
    fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=30`).then((r) => r.json()).catch(() => []),
  ]);
  overall(sites);
  $('services').replaceChildren(...sites.map(service));
  incidents(Array.isArray(issues) ? issues : []);
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
